# CI: frontend build + backend tests with Postgres + Alembic.
#
# Note: Alembic revisions through 024 are largely PostgreSQL-specific (raw SQL,
# JSONB, pg enums). CI uses Postgres so `alembic upgrade head` reflects what works
# today. MySQL as the platform DB requires follow-up migration work; track that
# in docs/STABILIZATION_CHECKLIST.md.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  backend:
    name: Backend (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supply_planning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supply_planning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/supply_planning
      ALLOW_DEMO_DATA: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Alembic upgrade (Postgres)
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q --tb=short
